            <li class="carousel-slide carousel-slide-active" data-ssplayer-slide-index="0" style="width: 507px; height: 507px;"><img class="carousel-lazy-element carousel-element-loaded carousel-element-load-success" data-src="https://media.licdn.com/dms/image/v2/D4D1FAQHoqhsnfShRZA/feedshare-document-images_800/B4DZ6sFnqqKQAk-/1/1781003616158?e=1788393600&amp;v=beta&amp;t=ob65q83aTqxIUiC23hH9VDo9jOmK8IpXmC_HDIdwHZ4" alt="C L I M A T E R I S K · R E S E A R C H B R I E F India&#39;s arid wetlands are running out of dry ground. A new study maps flood hazard, risk and climate futures across 17 Ramsar wetlands in India&#39;s desert sand steppe places that are ecological lifelines for millions of people and migratory birds, yet barely studied for flood risk. 17 study sites across the &quot;Arid Desert Hot&quot; (red) and &quot;Arid Steppe Hot&quot; (orange) climate zones Arid Ramsar Flood Risk Dr. Shivukumar Rakkasagi, Kushal Jagdish Patil, Prof. Manish Kumar Goyal, Shimrit Maman AUTHOR mkgoyal@iiti.ac.in +91 9435880989 Physics &amp; Chemistry of the Earth (2026)" src="./1781003616158"></li><li class="carousel-slide" data-ssplayer-slide-index="1" tabindex="-1" aria-hidden="true" style="width: 507px; height: 507px;"><img class="carousel-lazy-element" data-src="https://media.licdn.com/dms/image/v2/D4D1FAQHoqhsnfShRZA/feedshare-document-images_800/B4DZ6sFnqqKQAk-/2/1781003616158?e=1788393600&amp;v=beta&amp;t=GKvh7PlyqzVXu6ePOd8EZxFPbIOXwFyV7v0W0x4aEIU" alt="H O W T H E S T U D Y W O R K S A GEV model run over 1951–2022 IMD rainfall, tuned by ENSO, IOD &amp; AMO across 56 combinations to estimate 10–100 year return levels. Risk = Hazard × Vulnerability × Exposure - blended with fuzzy membership so a site can be partly &quot;high&quot; and partly &quot;very high&quot; at once. 13 climate models under SSP245 &amp; SSP585, tested with the Modified Mann-Kendall trend test out to the year 2100. Three methods, one risk picture. Most flood studies assume the past predicts the future. This one doesn&#39;t, it lets large-scale climate cycles bend the statistics. 01 02 03 CMIP6 future trends Fuzzy-logic flood risk Non-stationary extreme rainfall Rx1 · daily max rain SDII · rain intensity R10 · heavy-rain days CWD · wet spells Arid Ramsar Flood Risk" src="./1781003616158(1)"></li><li class="carousel-slide" data-ssplayer-slide-index="2" tabindex="-1" aria-hidden="true" style="width: 507px; height: 507px;"><img class="carousel-lazy-element" data-src="https://media.licdn.com/dms/image/v2/D4D1FAQHoqhsnfShRZA/feedshare-document-images_800/B4DZ6sFnqqKQAk-/3/1781003616158?e=1788393600&amp;v=beta&amp;t=Lp6RGCyg1tFff-DFOIdRZOOx38X7_j4atpifTAnJCkA" alt="W H E R E T H E R A I N H I T S H A R D E S T No single site owns every extreme. ~320 ~42 CWD Ranganathittu sees the longest wet spells mm mm/d Nalsarovar tops the 100-yr daily-max rain (Rx1) Khijadia leads rain intensity (SDII)&amp; heavy-rain days (R10) Arid Ramsar Flood Risk Fig. 3 · 95% Bayesian credible intervals widen sharply at 100-yr levels"></li><li class="carousel-slide" data-ssplayer-slide-index="3" tabindex="-1" aria-hidden="true" style="width: 507px; height: 507px;"><img class="carousel-lazy-element" data-src="https://media.licdn.com/dms/image/v2/D4D1FAQHoqhsnfShRZA/feedshare-document-images_800/B4DZ6sFnqqKQAk-/4/1781003616158?e=1788393600&amp;v=beta&amp;t=g2tkvZN_kJLg2rWbVFcKffBUvjr3azDHLheOh6QEqa8" alt="T H E T W I S T H A Z A R D ≠ R I S K Khijadia records the highest rainfall extremes yet ranks only moderate risk. 0 4 / 0 5 The wettest site isn&#39;t the riskiest one. Six wetlands land in the very-high-risk band Sarsai Nawar Jheel, Beas Conservation Reserve, Chitrangudi, Kanjirankulam, Ranganathittu &amp; Saman Bird Sanctuary. Arid Ramsar Flood Risk Fig. 4 · Bars = composite risk · hazard · ▲ vulnerability◆"></li><li class="carousel-slide" data-ssplayer-slide-index="4" tabindex="-1" aria-hidden="true" style="width: 507px; height: 507px;"><img class="carousel-lazy-element" data-src="https://media.licdn.com/dms/image/v2/D4D1FAQHoqhsnfShRZA/feedshare-document-images_800/B4DZ6sFnqqKQAk-/5/1781003616158?e=1788393600&amp;v=beta&amp;t=U-10naMZ3hbruS8Fi_EsJr4m2AaxEynlWCaL-iATVRc" alt="W H A T 2 1 0 0 L O O K S L I K E 0 5 / 0 5 Hotter and wetter everywhere, no exceptions. → ↑ ↓ Under high emissions (SSP585), all 17 wetlands face rising rain and temperature warming of 3.5–5.0 °C by 2100. Hitting Paris-aligned targets (SSP245) cuts that warming by ~2–3 °C and halves the rainfall surge. Protect by vulnerability, not just hazard: early-warning systems, buffer zones &amp; dam coordination where people and birds are most exposed. ◀  Found this useful? Save &amp; share. Arid Ramsar Flood Risk Fig. 7 · SSP585 trends, 13-model CMIP6 ensemble (2023–2100) mkgoyal@iiti.ac.in +91 9435880989 Prof. Manish Kumar Goyal Professor of Civil Engineering Chair Professor BIS Standardization Indian Institute of Technology, Indore"></li></ul></div>
