re, ahead of Arunachal Pradesh (26%) Fig. 3 — Lake area (km²) and lake count by state and river basin, 1993 vs. 2018 Lake Types Identified Moraine-dammed 154 lakes · 47% Other (erosional / debris) 87 lakes · 26% Ice-dammed 57 lakes · 17% Bedrock-dammed 31 lakes · 9% Source: Dubey, S., &amp; Goyal, M. K. (2020). Water Resources Research, 56, e2019WR026533. 2"></li><li class="carousel-slide" data-ssplayer-slide-index="2" tabindex="-1" aria-hidden="true" style="width: 508px; height: 285px;"><img class="carousel-lazy-element" data-src="https://media.licdn.com/dms/image/v2/D4D1FAQGvmzO5m9p4Hg/feedshare-document-images_800/B4DZ9Gb37cJsAo-/3/1783593140865?e=1788393600&amp;v=beta&amp;t=Vjf7NbuOWbLI6Ua8KGnywvWvCBD89_JxTEyOsc85GtY" alt="H A Z A R D A S S E S S M E N T What Triggers a Glacial Lake Outburst? Six triggers avalanche and rockfall entry, upstream GLOF cascades, moraine stability, ice cores, and lake expansion were modeled from DEM and satellite data, then combined into a four-tier hazard rating for every lake. Fig. 4 — Summary of the six hazard parameters modeled across all 329 lakes 28 Very High Hazard 50 High Hazard 198 Moderate Hazard 53 Low Hazard Source: Dubey, S., &amp; Goyal, M. K. (2020). Water Resources Research, 56, e2019WR026533. 3"></li><li class="carousel-slide" data-ssplayer-slide-index="3" tabindex="-1" aria-hidden="true" style="width: 508px; height: 285px;"><img class="carousel-lazy-element" data-src="https://media.licdn.com/dms/image/v2/D4D1FAQGvmzO5m9p4Hg/feedshare-document-images_800/B4DZ9Gb37cJsAo-/4/1783593140865?e=1788393600&amp;v=beta&amp;t=Wv7GCM62fd8hrS7J_YDXvmjD5kahqFusuOhZew9NfH8" alt="D O W N S T R E A M I M P A C T Communities and Infrastructure in the Flood Path A stochastic flood-routing model (MC-LCP) traced each lake&#39;s potential 50 km flow path to count exposed buildings, bridges, and hydropower systems. 67 lakes threaten at least one hydropower system — 15 threaten two 9 lakes could inundate more than 1,000 buildings; the median lake threatens 54 0–17 bridges at risk per lake (median 4), identified via OpenStreetMap crossings 217 lakes could inundate 20 or more buildings downstream Fig. 6 — Bridges, hydropower systems, and buildings threatened, by state Source: Dubey, S., &amp; Goyal, M. K. (2020). Water Resources Research, 56, e2019WR026533. 4"></li><li class="carousel-slide" data-ssplayer-slide-index="4" tabindex="-1" aria-hidden="true" style="width: 508px; height: 285px;"><img class="carousel-lazy-element" data-src="https://media.licdn.com/dms/image/v2/D4D1FAQGvmzO5m9p4Hg/feedshare-document-images_800/B4DZ9Gb37cJsAo-/5/1783593140865?e=1788393600&amp;v=beta&amp;t=m4yqrrHZ_eQihNeNYdVsKif5MsZE3M5HgE7hlHOI3ws" alt="C O M B I N E D R I S K R A N K I N G 23 Lakes Rank as Very High Risk Hazard and downstream impact were combined into one risk chart. Sikkim alone holds 17 of the 23 very-high-risk lakes — more than any other state. 23 Very High 50 High 195 Moderate 61 Low Lakes Demanding Priority Attention Shakho Cho &amp; Khangchung Tso Named by the study as the most considerable overall risk — gauged, yet still without mitigation measures. Gurudongmar Lake Largest potential flood volume of any lake: 49.89 × 10⁶ m³, driven by its size and 42.5° steep moraine. South Lhonak Lake, Sikkim The only Indian lake with attempted remediation — a 3 m lowering, within DEM margin of error. Fig. 7 — Hazard, downstream impact &amp; risk classification by state Recommendation: field-based validation and hydrodynamic modeling of very- high-risk lakes before any mitigation is implemented. 5 Prof. Manish Kumar Goyal Professor of Civil Engineering Indian Institute of Technology, Indore mkgoyal@iiti.ac.in +91 9435880989"></li></ul></div>
